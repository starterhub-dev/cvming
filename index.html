<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="TinyMind 微型智能实验室：一个从零开始学习 AI 的在线聊天助手。">
  <title>TinyMind · 微型智能实验室</title>
  <style>
    :root{color-scheme:dark;--bg:#0c1019;--panel:#141b29;--panel2:#1a2334;--line:#293449;--text:#f3f6fc;--muted:#9ba8bd;--accent:#8ca7ff;--accent2:#b8c7ff;--green:#9be6c1}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#243052 0,transparent 50%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
    .app{width:min(100%,900px);min-height:100dvh;display:flex;flex-direction:column;padding:0 16px env(safe-area-inset-bottom)}
    header{display:flex;align-items:center;gap:12px;padding:20px 0 16px;border-bottom:1px solid var(--line)}
    .logo{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#9cb4ff,#6378d8);color:#0b1120;font-size:23px;box-shadow:0 8px 28px #667ee533}
    h1{font-size:18px;line-height:1.2;margin:0 0 4px;letter-spacing:.2px}
    .subtitle{font-size:12px;color:var(--muted)}
    .status{margin-left:auto;border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:var(--muted);font-size:11px;white-space:nowrap}
    .status:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#e5b86b;margin-right:6px;vertical-align:1px}
    .intro{padding:24px 0 12px}
    .eyebrow{color:var(--accent2);font-size:11px;font-weight:700;letter-spacing:1.6px}
    h2{font-size:clamp(25px,6vw,34px);line-height:1.18;letter-spacing:-.7px;margin:8px 0 10px}
    .intro p{margin:0;color:var(--muted);font-size:14px;max-width:620px}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    .chip{background:#151e30;border:1px solid var(--line);border-radius:12px;padding:8px 11px;color:#d9e2f7;font-size:12px;cursor:pointer}
    .chip:active{transform:scale(.98)}
    .chat{flex:1;min-height:260px;padding:14px 0 18px;display:flex;flex-direction:column;gap:15px}
    .msg{display:flex;gap:9px;align-items:flex-start;max-width:92%;animation:appear .18s ease-out}
    .msg.user{align-self:flex-end;flex-direction:row-reverse}
    .avatar{flex:0 0 30px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#202c43;color:#c7d5ff;font-size:14px}
    .user .avatar{background:#35446a;color:white}
    .bubble{padding:11px 13px;border:1px solid var(--line);background:var(--panel);border-radius:5px 15px 15px 15px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
    .user .bubble{background:#253354;border-color:#3a4b73;border-radius:15px 5px 15px 15px}
    .bubble p{margin:0}
    .typing{color:var(--muted);font-size:13px;padding:8px 0}
    .composer-wrap{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:14px 0 calc(12px + env(safe-area-inset-bottom))}
    .composer{display:flex;align-items:flex-end;gap:9px;padding:8px;background:#151c2a;border:1px solid #344158;border-radius:18px;box-shadow:0 10px 30px #0003}
    textarea{flex:1;min-width:0;resize:none;max-height:140px;min-height:42px;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:14px;line-height:1.5;padding:10px 8px}
    textarea::placeholder{color:#8290a8}
    .send{border:0;border-radius:12px;background:var(--accent);color:#11182a;font-weight:750;width:43px;height:43px;font-size:18px;cursor:pointer}
    .send:disabled{opacity:.4;cursor:wait}
    .foot{display:flex;justify-content:space-between;gap:10px;color:#758198;font-size:10px;padding:8px 3px 2px}
    .clear{color:#aab8d4;text-decoration:underline;text-underline-offset:3px;background:none;border:0;font:inherit;cursor:pointer}
    .notice{font-size:11px;color:#8390a7;text-align:center;margin:8px 0 0}
    @keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    @media(min-width:700px){.app{padding-left:28px;padding-right:28px}.intro{padding-top:34px}.chat{padding-top:22px}.bubble{font-size:15px}.msg{max-width:82%}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

    /* Mobile-first chat shell: keep the page fixed and let messages own the scroll. */
    html{height:100%;overflow:hidden}
    body{height:100%;min-height:0;overflow:hidden;overscroll-behavior:none}
    .app{height:var(--app-height,100dvh);min-height:0;overflow:hidden;padding-bottom:0}
    header,.intro,.composer-wrap{flex-shrink:0}
    .status{flex-shrink:0}
    .chat{min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#344158 transparent;overflow-anchor:none}
    .msg{min-width:0}
    .bubble{min-width:0;max-width:100%;line-height:1.65}
    .composer-wrap{position:relative;bottom:auto;z-index:2;padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 18%)}
    textarea{min-height:44px;max-height:120px;overflow-y:auto;font-size:16px;line-height:1.45;touch-action:manipulation}
    .send{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center}
    .app.has-conversation .intro{display:none}
    .app.has-conversation header{padding-top:8px;padding-bottom:8px}
    .code-block{max-width:100%;min-width:0;margin:10px 0;border:1px solid #303e56;border-radius:11px;overflow:hidden;background:#0d1320}
    .code-head{padding:6px 10px;border-bottom:1px solid #28364c;color:#9eacc5;font-size:11px;line-height:1.4}
    .code-block pre{margin:0;max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding:11px 12px;color:#e0e8fb;font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;tab-size:2}
    .code-block code{font:inherit}
    .bubble p{overflow-wrap:anywhere}
    .composer:focus-within{border-color:#657fc7;box-shadow:0 0 0 3px #8ca7ff18,0 10px 30px #0003}
    .send:focus-visible,.chip:focus-visible,.clear:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
    @media(max-width:600px){
      .app{padding-left:12px;padding-right:12px}
      header{gap:9px;padding:12px 0 10px}
      .logo{width:36px;height:36px;flex:0 0 36px;border-radius:12px;font-size:20px}
      h1{font-size:17px}
      .subtitle{font-size:11px}
      .status{padding:4px 7px;font-size:10px}
      .intro{padding:18px 0 9px}
      h2{font-size:clamp(24px,7vw,30px);margin:7px 0 8px}
      .intro p{font-size:13px;line-height:1.6}
      .chips{gap:6px;margin-top:12px}
      .chip{padding:7px 9px;border-radius:10px;font-size:11px}
      .chat{gap:12px;padding:10px 0 12px}
      .msg{max-width:100%;gap:7px}
      .avatar{width:26px;height:26px;flex-basis:26px;border-radius:9px;font-size:12px}
      .bubble{padding:10px 12px;font-size:14px;line-height:1.65}
      .user .bubble{border-radius:13px 5px 13px 13px}
      .composer-wrap{padding-top:6px}
      .composer{gap:7px;padding:6px;border-radius:16px}
      textarea{padding:9px 7px;font-size:16px}
      .send{width:44px;height:44px;flex-basis:44px;border-radius:13px;font-size:20px}
      .foot{gap:8px;font-size:11px;padding:7px 2px 0}
      .notice{margin-top:6px;font-size:10px}
    }
    @media(max-height:520px){
      header{padding-top:6px;padding-bottom:6px}
      .app.has-conversation header{padding-top:4px;padding-bottom:4px}
      .composer-wrap{padding-top:4px}
      .notice{margin-top:3px}
    }

  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo" aria-hidden="true">✳</div>
      <div><h1>TinyMind</h1><div class="subtitle">微型智能实验室 · 观察人类抽象行为中</div></div>
      <div class="status" id="status">等待连接</div>
    </header>
    <section class="intro">
      <div class="eyebrow">YOUR FIRST AI PROJECT</div>
      <h2>你好，探索者。<br>我们从这里开始。</h2>
      <p>这是 TinyMind 的第一个版本。可以问编程、机器学习，也可以一起拆解一个新想法。先提出问题，剩下的我们一步步来。</p>
      <div class="chips" aria-label="建议问题">
        <button class="chip" data-prompt="用最简单的方式解释什么是机器学习。">🧠 什么是机器学习？</button>
        <button class="chip" data-prompt="请用 Python 给我一个最简单的入门例子，并逐行解释。">🐍 学一点 Python</button>
        <button class="chip" data-prompt="我想训练自己的第一个小模型，应该从哪里开始？">🧪 训练第一个模型</button>
      </div>
    </section>
    <section class="chat" id="chat">
      <div class="msg">
        <div class="avatar">✳</div>
        <div class="bubble"><p>嗨，我是 TinyMind。🤓<br><br>爱好：观察人类的抽象行为。<br>原则：证据优先，拒绝盲从，发现错误就修正。<br><br>你可以问正经问题，也可以说点抽象的。</p></div>
      </div>
    </section>
    <div class="composer-wrap">
      <form class="composer" id="form">
        <textarea id="input" rows="1" maxlength="4000" placeholder="给 TinyMind 发一条消息…" aria-label="消息内容"></textarea>
        <button class="send" id="send" type="submit" aria-label="发送消息">↑</button>
      </form>
      <div class="foot"><span>每次提问都是一次小实验</span><button class="clear" id="clear" type="button">清空对话</button></div>
      <p class="notice">请勿发送密码、密钥或其他敏感个人信息。</p>
    </div>
  </main>
<script>
  const API_URL = "https://rebwsnahwpyqahmuycri.supabase.co/functions/v1/tinymind-chat";
  const STORAGE_KEY = "tinymind-chat-v1";
  const chat=document.querySelector("#chat"),form=document.querySelector("#form"),input=document.querySelector("#input"),send=document.querySelector("#send"),stopButton=document.querySelector("#stop"),statusEl=document.querySelector("#status"),app=document.querySelector(".app"),chips=document.querySelector(".chips");
  let messages=[],displayItems=[],busy=false,abortController=null;
  function setStatus(state,label){statusEl.dataset.state=state;statusEl.textContent=label;}
  function syncAppHeight(){const v=window.visualViewport;document.documentElement.style.setProperty("--app-height",Math.round(v&&v.height?v.height:window.innerHeight)+"px");}
  syncAppHeight();window.addEventListener("resize",syncAppHeight,{passive:true});if(window.visualViewport){window.visualViewport.addEventListener("resize",syncAppHeight,{passive:true});window.visualViewport.addEventListener("scroll",syncAppHeight,{passive:true});}
  function scrollChatToBottom(){requestAnimationFrame(()=>chat.scrollTo({top:chat.scrollHeight,behavior:"auto"}));}
  function saveConversation(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({messages:messages.slice(-20),displayItems:displayItems.slice(-80),hasConversation:app.classList.contains("has-conversation")}));}catch(e){console.warn("Could not save TinyMind history",e);}}
  function renderMarkdown(bubble,text){if(window.marked&&window.DOMPurify){bubble.innerHTML=window.DOMPurify.sanitize(window.marked.parse(text,{gfm:true,breaks:true}),{USE_PROFILES:{html:true}});bubble.querySelectorAll("a").forEach(a=>{a.target="_blank";a.rel="noopener noreferrer";});}else{bubble.textContent=text;bubble.style.whiteSpace="pre-wrap";}}
  function setAssistantLive(row){chat.querySelectorAll('[aria-live="polite"]').forEach(n=>n.setAttribute("aria-live","off"));row.setAttribute("aria-live","polite");row.setAttribute("aria-atomic","false");}
  function addMessage(role,text,options={}){const row=document.createElement("div");row.className="msg "+(role==="user"?"user":"");if(role==="assistant"&&options.live!==false)setAssistantLive(row);const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=role==="user"?"你":"✳";const bubble=document.createElement("div");bubble.className="bubble";if(role==="assistant")renderMarkdown(bubble,text);else{const p=document.createElement("p");p.textContent=text;bubble.appendChild(p);}row.append(avatar,bubble);chat.appendChild(row);scrollChatToBottom();return row;}
  function addRetryButton(row){const b=document.createElement("button");b.className="retry";b.type="button";b.textContent="重试";b.addEventListener("click",()=>{if(!busy&&messages.length&&messages[messages.length-1].role==="user")requestAI();});row.querySelector(".bubble").appendChild(b);}
  function friendlyError(status){if(status===429)return"请求有点频繁，等一分钟再试试。";if(status===413||status===400)return"这条消息太长或格式不正确，调整一下再试试。";if(status===503)return"AI 服务暂时不可用，请稍后再试。";return"网络不太好，再试一次吧。";}
  async function requestAI(){
    if(busy||!messages.length||messages[messages.length-1].role!=="user")return;
    busy=true;abortController=new AbortController();send.disabled=true;input.disabled=true;stopButton.hidden=false;setStatus("loading","思考中");
    const row=addMessage("assistant","");const bubble=row.querySelector(".bubble");bubble.textContent="正在连接…";let fullText="";
    try{
      const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:messages.slice(-20)}),signal:abortController.signal});
      if(!response.ok){let data={};try{data=await response.json();}catch{}const e=new Error(friendlyError(response.status));e.status=response.status;throw e;}
      if(!response.body)throw new Error("stream_unavailable");
      const reader=response.body.getReader(),decoder=new TextDecoder();let buffer="";
      while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const events=buffer.split("\n\n");buffer=events.pop()||"";
        for(const event of events)for(const line of event.split("\n")){if(!line.startsWith("data:"))continue;const raw=line.slice(5).trim();if(!raw||raw==="[DONE]")continue;let part;try{part=JSON.parse(raw);}catch{continue;}
          const delta=typeof part.response==="string"?part.response:typeof part.token==="string"?part.token:typeof part.choices?.[0]?.delta?.content==="string"?part.choices[0].delta.content:typeof part.result?.response==="string"?part.result.response:"";
          if(delta){fullText+=delta;bubble.textContent=fullText;scrollChatToBottom();}if(part.error)throw new Error("stream_error");
        }
      }
      if(!fullText.trim())throw new Error("empty_reply");renderMarkdown(bubble,fullText);messages.push({role:"assistant",content:fullText});const item={id:crypto.randomUUID(),role:"assistant",content:fullText,kind:"message"};displayItems.push(item);row.dataset.messageId=item.id;saveConversation();setStatus("online","已连接");
    }catch(error){
      if(error.name==="AbortError"){const stopped=fullText.trim()?fullText+"\n\n（已停止生成）":"已停止生成。";renderMarkdown(bubble,stopped);const item={id:crypto.randomUUID(),role:"assistant",content:stopped,kind:"stopped"};displayItems.push(item);row.dataset.messageId=item.id;saveConversation();setStatus("ready","就绪");}
      else{const friendly=error.status?friendlyError(error.status):error.message==="empty_reply"?"这次没有收到回复，再试一次吧。":"网络不太好，再试一次吧。";bubble.replaceChildren();const p=document.createElement("p");p.className="error-copy";p.textContent=friendly;bubble.appendChild(p);addRetryButton(row);const item={id:crypto.randomUUID(),role:"assistant",content:friendly,kind:"error"};displayItems.push(item);row.dataset.messageId=item.id;saveConversation();setStatus("error","连接失败");}
    }finally{busy=false;abortController=null;send.disabled=false;input.disabled=false;stopButton.hidden=true;input.focus({preventScroll:true});scrollChatToBottom();}
  }
  function sendMessage(text){text=text.trim();if(!text||busy)return;if(text.length>4000){setStatus("error","消息太长");return;}app.classList.add("has-conversation");if(chips)chips.hidden=true;messages.push({role:"user",content:text});messages=messages.slice(-20);const row=addMessage("user",text);const item={id:crypto.randomUUID(),role:"user",content:text,kind:"message"};displayItems.push(item);row.dataset.messageId=item.id;saveConversation();input.value="";input.style.height="44px";requestAI();}
  form.addEventListener("submit",e=>{e.preventDefault();sendMessage(input.value);});
  input.addEventListener("input",()=>{input.style.height="44px";input.style.height=Math.min(input.scrollHeight,120)+"px";});
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();form.requestSubmit();}});
  document.querySelectorAll("[data-prompt]").forEach(b=>b.addEventListener("click",()=>{input.value=b.dataset.prompt;b.hidden=true;input.focus();input.style.height="auto";input.style.height=Math.min(input.scrollHeight,120)+"px";}));
  stopButton.addEventListener("click",()=>{if(abortController)abortController.abort();});
  document.querySelector("#clear").addEventListener("click",()=>{if(busy)return;messages=[];displayItems=[];app.classList.remove("has-conversation");if(chips){chips.hidden=false;chips.querySelectorAll(".chip").forEach(b=>b.hidden=false);}chat.replaceChildren();addMessage("assistant","嗨，我是 TinyMind。🤓\n\n爱好：观察人类的抽象行为。\n原则：证据优先，拒绝盲从，发现错误就修正。\n\n你可以问正经问题，也可以说点抽象的。",{live:false});localStorage.removeItem(STORAGE_KEY);setStatus("ready","就绪");});
  function restoreConversation(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");if(!saved)return;messages=Array.isArray(saved.messages)?saved.messages.slice(-20):[];displayItems=Array.isArray(saved.displayItems)?saved.displayItems.slice(-80):[];if(saved.hasConversation||displayItems.some(i=>i.role==="user"))app.classList.add("has-conversation");if(app.classList.contains("has-conversation")&&chips)chips.hidden=true;chat.replaceChildren();for(const item of displayItems){const row=addMessage(item.role,item.content,{live:false});row.dataset.messageId=item.id;if(item.kind==="error")addRetryButton(row);}if(!displayItems.length)addMessage("assistant","嗨，我是 TinyMind。🤓\n\n爱好：观察人类的抽象行为。\n原则：证据优先，拒绝盲从，发现错误就修正。\n\n你可以问正经问题，也可以说点抽象的。",{live:false});}catch(e){console.warn("Could not restore TinyMind history",e);}}
  restoreConversation();setStatus("ready","就绪");


</body>
</html>
